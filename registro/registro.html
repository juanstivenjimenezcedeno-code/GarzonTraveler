<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/registro/sesionregistro.css">
    <title>Registro - Garzón Traveler</title>
</head>

<body>
    <div class="registro-container">
        <div class="auth-tabs">
            <button class="tab-btn" type="button" data-link="iniciosesion.html">Iniciar sesión</button>
            <button class="tab-btn active" type="button" data-link="registro.html">Registrarse</button>
        </div>

        <div class="titulo-login">Registrarse</div>

        <!-- LOGO -->
        <div class="logo-container">
            <svg class="logo-icono" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
                <circle cx="46" cy="16" r="7" fill="#e6b800" />
                <path d="M2 46 L20 20 L30 34 L38 24 L58 46 Z" fill="#1e4d2b" />
                <path d="M20 20 L30 34 L24 34 L14 46 L2 46 Z" fill="#3a7a3f" />
                <path d="M48 40 C48 34 54 34 54 40 C54 44 48 46 48 46 C48 46 42 44 42 40 C42 34 48 34 48 40 Z"
                    fill="#4a8a3f" />
            </svg>
            <h1 class="logo-nombre">GARZÓN <span>TRAVELER</span></h1>
            <p class="logo-tagline">Descubre, vive, recuerda.</p>
            <div class="logo-divider"><span></span><span class="hoja">❧</span><span></span></div>
        </div>

        <!-- FORMULARIO DE REGISTRO -->
        <form class="formulario-registro" id="registerForm">

            <!-- NOMBRE -->
            <div class="input-group">
                <span class="icono-circulo">
                    <svg viewBox="0 0 24 24">
                        <path fill="#fff"
                            d="M12 12c2.7 0 4.9-2.2 4.9-4.9S14.7 2.2 12 2.2 7.1 4.4 7.1 7.1 9.3 12 12 12zm0 2.5c-3.3 0-9.9 1.6-9.9 4.9v2.4h19.8v-2.4c0-3.3-6.6-4.9-9.9-4.9z" />
                    </svg>
                </span>
                <div class="input-texto">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ingresa tu nombre" required>
                </div>
            </div>

            <!-- apellido -->
            <div class="input-group">
                <span class="icono-circulo">
                    <svg viewBox="0 0 24 24">
                        <path fill="#fff"
                            d="M12 12c2.7 0 4.9-2.2 4.9-4.9S14.7 2.2 12 2.2 7.1 4.4 7.1 7.1 9.3 12 12 12zm0 2.5c-3.3 0-9.9 1.6-9.9 4.9v2.4h19.8v-2.4c0-3.3-6.6-4.9-9.9-4.9z" />
                    </svg>
                </span>
                <div class="input-texto">
                    <label for="apellido">Apellido</label>
                    <input type="text" id="apellido" name="apellido" placeholder="Ingresa tu apellido" required>
                </div>
            </div>

            <!-- EMAIL -->
            <div class="input-group">
                <span class="icono-circulo">
                    <svg viewBox="0 0 24 24">
                        <path fill="#fff"
                            d="M2 5.5C2 4.7 2.7 4 3.5 4h17c.8 0 1.5.7 1.5 1.5v13c0 .8-.7 1.5-1.5 1.5h-17C2.7 20 2 19.3 2 18.5v-13zM4 6l8 6 8-6" />
                    </svg>
                </span>
                <div class="input-texto">
                    <label for="correo">Correo</label>
                    <input type="email" id="correo" name="correo" placeholder="Ingresa tu correo electrónico" required>
                </div>
            </div>

            <!-- TELÉFONO -->
            <div class="input-group">
                <span class="icono-circulo">
                    <svg viewBox="0 0 24 24">
                        <path fill="#fff"
                            d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.5.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.9 21 3 13.1 3 3c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.5.1.4 0 .8-.3 1.1L6.6 10.8z" />
                    </svg>
                </span>
                <div class="input-texto">
                    <label for="telefono">Número Telefónico</label>
                    <input type="tel" id="telefono" name="telefono" placeholder="Ingresa tu número de teléfono"
                        required>
                </div>
            </div>

            <!-- CONTRASEÑA -->
            <div class="input-group">
                <span class="icono-circulo">
                    <svg viewBox="0 0 24 24">
                        <path fill="#fff"
                            d="M6 10V8a6 6 0 1 1 12 0v2h1a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1h1zm2 0h8V8a4 4 0 1 0-8 0v2z" />
                    </svg>
                </span>
                <div class="input-texto">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="Crea una contraseña segura"
                        required>
                </div>
                <button type="button" class="toggle-password" aria-label="Mostrar contraseña">
                    <svg viewBox="0 0 24 24">
                        <path fill="#555"
                            d="M12 5c-7 0-10 7-10 7s3 7 10 7 10-7 10-7-3-7-10-7zm0 11.5A4.5 4.5 0 1 1 12 7.5a4.5 4.5 0 0 1 0 9zm0-2A2.5 2.5 0 1 0 12 9a2.5 2.5 0 0 0 0 5z" />
                    </svg>
                </button>
            </div>

            <!-- BOTÓN -->
            <button type="submit" class="registro-button" id="btn-guardar"> 
                <svg class="hoja-icono" viewBox="0 0 24 24">
                    <path fill="#fff"
                        d="M17 8C8 10 5.9 16.17 3.82 21.34l1.89.66.95-2.3c.48.17 1.39.5 2.34.5C21 20 22 8 22 3c0 0-4 3-9 3S6.4 4 4 4c-.5 4.5 1 8 3 10.5" />
                </svg>
                Crear cuenta
            </button>
        </form>

        <!-- DIVISOR -->
        <div class="divisor">
            <span></span>
            <p>o regístrate con</p><span></span>
        </div>

        <!-- REGISTRO CON REDES -->
        <div class="redes-login">
            <button class="google-button">
                <span class="google-icono">G</span>
                Google
            </button>
            <button class="facebook-button">
                <span class="facebook-icono">f</span>
                Facebook
            </button>
        </div>

        <!-- SEGURIDAD -->
        <div class="seguridad">
            <svg viewBox="0 0 24 24">
                <path fill="#1e4d2b" d="M12 2 4 5v6c0 5.5 3.4 10.7 8 12 4.6-1.3 8-6.5 8-12V5l-8-3z" />
            </svg>
            <p>Tus datos están protegidos con nosotros</p>
        </div>

        <p class="texto-enlace">
            ¿Ya tienes cuenta? <a href="iniciosesion.html">Inicia sesión</a>
        </p>

    </div>
    <script src="registro.js"></script>
</body>

</html>
