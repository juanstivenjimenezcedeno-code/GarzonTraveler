<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="sesionregistro.css">
    <title>inicio de sesion</title>
</head>

<body>
    <div class="login-container">
        <div class="auth-tabs">
            <button class="tab-btn active" type="button">Iniciar sesión</button>
            <button class="tab-btn" type="button" data-link="registro.html">Registrarse</button>
        </div>

        <div class="auth-panel active" id="login-panel">
            <div class="titulo-login">Iniciar sesión</div>
            <div class="logo-container">
                <svg class="logo-icono" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="46" cy="16" r="7" fill="#e6b800" />
                    <path d="M2 46 L20 20 L30 34 L38 24 L58 46 Z" fill="#1e4d2b" />
                    <path d="M20 20 L30 34 L24 34 L14 46 L2 46 Z" fill="#3a7a3f" />
                    <path d="M48 40 C48 34 54 34 54 40 C54 44 48 46 48 46 C48 46 42 44 42 40 C42 34 48 34 48 40 Z"
                        fill="#4a8a3f" />
                </svg>
                <h1 class="logo-nombre">GARZÓN <span>TRAVELER</span></h1>
                <p class="logo-tagline">Descubre, vive, recuerda.</p>
                <div class="logo-divider"><span></span><span class="hoja">❧</span><span></span></div>
            </div>

            <form class="formulario" id="loginForm">
                <div class="formulario-espacio">
                    <span class="icono-circulo">
                        <svg viewBox="0 0 24 24">
                            <path fill="#fff"
                                d="M2 5.5C2 4.7 2.7 4 3.5 4h17c.8 0 1.5.7 1.5 1.5v13c0 .8-.7 1.5-1.5 1.5h-17C2.7 20 2 19.3 2 18.5v-13zM4 6l8 6 8-6" />
                        </svg>
                    </span>
                    <div class="input-texto">
                        <label for="correo">Correo</label>
                        <input type="email" id="correo" name="correo" placeholder="Ingresa tu correo" required>
                    </div>
                </div>
                <div class="formulario-espacio">
                    <span class="icono-circulo">
                        <svg viewBox="0 0 24 24">
                            <path fill="#fff"
                                d="M6 10V8a6 6 0 1 1 12 0v2h1a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1h1zm2 0h8V8a4 4 0 1 0-8 0v2z" />
                        </svg>
                    </span>
                    <div class="input-texto">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña"
                            required>
                    </div>
                </div>

                <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>

                <button type="submit" class="boton-iniciarsesion texto-enlace">Iniciar sesión</button>
            </form>

            <div class="divisor">
                <span></span>
                <p>o continúa con</p><span></span>
            </div>

            <div class="redes-login">
                <button class="google-button" type="button">
                    <span class="google-icono">G</span>
                    Google
                </button>
                <button class="facebook-button" type="button">
                    <span class="facebook-icono">f</span>
                    Facebook
                </button>
            </div>
        </div>
    </div>

    <script src="inisiosesion.js"></script>
</body>

</html>
